name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install QEMU
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: qemu-system-x86 qemu-system-arm
          version: 1.0
      - name: Build
        run: zig build
      - name: Test (unit)
        timeout-minutes: 2
        run: zig build --test-timeout 5s test
      - name: Test (x86)
        timeout-minutes: 2
        run: timeout 5s zig build test-x86
      - name: Test (AArch64)
        timeout-minutes: 2
        run: timeout 5s zig build test-aarch64
